<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pbsGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="pbsLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pbsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- 背景层叠卡片 1 -->
  <rect x="6" y="6" width="22" height="26" rx="3" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.5"/>
  <!-- 背景层叠卡片 2 -->
  <rect x="10" y="10" width="22" height="26" rx="3" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1.5"/>
  <!-- 前置卡片条目 -->
  <line x1="14" y1="17" x2="24" y2="17" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="23" x2="22" y2="23" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="29" x2="26" y2="29" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 批量并发放大镜 -->
  <circle cx="31" cy="27" r="10" fill="#FFFFFF" fill-opacity="0.85" stroke="url(#pbsLens)" stroke-width="3"/>
  <circle cx="31" cy="27" r="6.5" fill="none" stroke="url(#pbsCyan)" stroke-width="1.5" stroke-dasharray="2 3"/>
  <!-- 并发扫描网格 -->
  <line x1="28" y1="27" x2="34" y2="27" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="31" y1="24" x2="31" y2="30" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 放大镜柄 -->
  <path d="M38.5 34.5 L44 40" stroke="url(#pbsGrad1)" stroke-width="4" stroke-linecap="round"/>
</svg>
