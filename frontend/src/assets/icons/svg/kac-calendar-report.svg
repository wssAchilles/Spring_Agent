<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pcrCal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pcrClock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- 日历外板 -->
  <rect x="6" y="9" width="31" height="33" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <!-- 日历顶部装订条 -->
  <path d="M6 13 C6 10.8 7.8 9 10 9 L33 9 C35.2 9 37 10.8 37 13 L37 17 L6 17 Z" fill="url(#pcrCal)"/>
  
  <!-- 双挂环 -->
  <rect x="12" y="5" width="4" height="6" rx="2" fill="#1E40AF"/>
  <rect x="27" y="5" width="4" height="6" rx="2" fill="#1E40AF"/>

  <!-- 周报网格点阵与对勾 -->
  <circle cx="12" cy="24" r="1.8" fill="#93C5FD"/>
  <circle cx="18" cy="24" r="1.8" fill="#93C5FD"/>
  <circle cx="24" cy="24" r="1.8" fill="#93C5FD"/>
  <circle cx="12" cy="31" r="1.8" fill="#93C5FD"/>
  <circle cx="18" cy="31" r="1.8" fill="#93C5FD"/>
  <!-- 完成周报勾选线条 -->
  <path d="M12 36 L16 39 L25 31" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 右下角工作台账时钟 -->
  <circle cx="34" cy="34" r="9" fill="#FFFBEB" stroke="url(#pcrClock)" stroke-width="2.5"/>
  <line x1="34" y1="34" x2="34" y2="29" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="34" x2="38" y2="34" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <circle cx="34" cy="34" r="1.5" fill="#B45309"/>
</svg>
