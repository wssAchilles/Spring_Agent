<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pdaBar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="pdaBar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pdaBar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="pdaTrend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- 坐标轴底线 -->
  <line x1="6" y1="41" x2="42" y2="41" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="41" x2="6" y2="8" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- 柱状图 (低 -> 中 -> 高) -->
  <rect x="11" y="27" width="6" height="14" rx="2" fill="url(#pdaBar1)"/>
  <rect x="21" y="19" width="6" height="22" rx="2" fill="url(#pdaBar2)"/>
  <rect x="31" y="12" width="6" height="29" rx="2" fill="url(#pdaBar3)"/>

  <!-- 陡峭向上趋势折线 -->
  <path d="M10 30 L17 25 L26 16 L37 8" stroke="url(#pdaTrend)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- 折线节点 -->
  <circle cx="17" cy="25" r="2.5" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="26" cy="16" r="2.5" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <circle cx="37" cy="8" r="3.5" fill="#10B981"/>
  
  <!-- 顶部向上箭头 -->
  <path d="M34 6 L39 6 L39 11" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
