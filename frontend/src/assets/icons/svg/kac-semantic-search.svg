<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pssSphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="pssBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- 高维语义超球面轮廓与经纬弧线 -->
  <circle cx="24" cy="24" r="18" fill="#F8FAFC" stroke="#818CF8" stroke-width="2"/>
  <ellipse cx="24" cy="24" rx="18" ry="7" fill="none" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="2 3"/>
  <ellipse cx="24" cy="24" rx="8" ry="18" fill="none" stroke="#C7D2FE" stroke-width="1.5"/>
  <line x1="6" y1="24" x2="42" y2="24" stroke="#A5B4FC" stroke-width="1.5"/>
  <line x1="24" y1="6" x2="24" y2="42" stroke="#A5B4FC" stroke-width="1.5"/>

  <!-- 语义向量相似度聚合光束与近邻点 -->
  <path d="M15 17 Q24 22 33 29" stroke="url(#pssBeam)" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <circle cx="15" cy="17" r="4" fill="#06B6D4"/>
  <circle cx="15" cy="17" r="2" fill="#FFFFFF"/>
  
  <circle cx="33" cy="29" r="4.5" fill="url(#pssSphere)"/>
  <circle cx="33" cy="29" r="2" fill="#38BDF8"/>
  
  <!-- 语义共振光晕 -->
  <circle cx="24" cy="21" r="2" fill="#F59E0B"/>
</svg>
