<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="pssFunnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="pssGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- 顶部大段长文信息输入排版 -->
  <line x1="8" y1="8" x2="40" y2="8" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="13" x2="37" y2="13" stroke="#C4B5FD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="18" x2="34" y2="18" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 萃取收束漏斗 -->
  <path d="M12 21 L36 21 L27 31 L27 34 L21 34 L21 31 Z" fill="url(#pssFunnel)"/>

  <!-- 凝结出的 3 条核心精华要点 (带发光金色标记) -->
  <rect x="14" y="38" width="20" height="4" rx="2" fill="#EDE9FE"/>
  <circle cx="10" cy="40" r="2.5" fill="url(#pssGold)"/>
  <line x1="16" y1="40" x2="30" y2="40" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>

  <!-- 核心萃取高光闪烁 -->
  <path d="M37 25 Q37 29 41 29 Q37 29 37 33 Q37 29 33 29 Q37 29 37 25 Z" fill="url(#pssGold)"/>
</svg>
