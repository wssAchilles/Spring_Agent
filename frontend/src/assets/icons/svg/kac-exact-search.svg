<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pesReticle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="pesTarget" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- 外围四角高精锁定刻度框 -->
  <path d="M10 16 L10 10 L16 10" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M32 10 L38 10 L38 16" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M38 32 L38 38 L32 38" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M16 38 L10 38 L10 32" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- 居中精密瞄准环 -->
  <circle cx="24" cy="24" r="13" fill="#F0FDF4" fill-opacity="0.6" stroke="url(#pesReticle)" stroke-width="2"/>
  <circle cx="24" cy="24" r="7" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
  
  <!-- 精准十字光标与靶心 -->
  <line x1="24" y1="6" x2="24" y2="15" stroke="url(#pesReticle)" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="33" x2="24" y2="42" stroke="url(#pesReticle)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="24" x2="15" y2="24" stroke="url(#pesReticle)" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="24" x2="42" y2="24" stroke="url(#pesReticle)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 核心精确命中点 -->
  <circle cx="24" cy="24" r="3" fill="url(#pesTarget)"/>
</svg>
