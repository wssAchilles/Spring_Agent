<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pgvRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="pgvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>
  <!-- 底层规范公文纸张 -->
  <rect x="7" y="6" width="28" height="36" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  <!-- 红头文件横线 -->
  <line x1="12" y1="12" x2="26" y2="12" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="18" x2="30" y2="18" stroke="#F87171" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="23" x2="28" y2="23" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="28" x2="24" y2="28" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 右下角政务红印章 (圆形印章带五角星) -->
  <circle cx="34" cy="32" r="10" fill="none" stroke="url(#pgvRed)" stroke-width="2.5"/>
  <!-- 印章内五角星 -->
  <polygon points="34,26 36,31 41,31 37,34 39,39 34,36 29,39 31,34 27,31 32,31" fill="url(#pgvRed)"/>
