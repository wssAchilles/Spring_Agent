  <circle cx="38" cy="14" r="5.5" fill="url(#pegSubNode2)"/>
  <circle cx="34" cy="38" r="5" fill="url(#pegSubNode3)"/>
  <circle cx="10" cy="34" r="4" fill="#94A3B8"/>

