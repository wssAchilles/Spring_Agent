                        - /url: StandardOpenOption.html
                      - text: CREATE
                    - generic [ref=f24e265]:
                      - text: Create a new file if it does not exist. This option is ignored if the
                      - link [ref=f24e266] [cursor=pointer]:
                        - /url: "#CREATE_NEW"
                        - code [ref=f24e267]: CREATE_NEW
                      - text: option is also set. The check for the existence of the file and the creation of the file if it does not exist is atomic with respect to other file system operations.
                - listitem [ref=f24e268]:
                  - generic [ref=f24e269]:
                    - heading "CREATE_NEW" [level=3] [ref=f24e270]
                    - generic [ref=f24e271]:
                      - text: public static final
                      - link "StandardOpenOption" [ref=f24e273] [cursor=pointer]:
                        - /url: StandardOpenOption.html
                      - text: CREATE_NEW
                    - generic [ref=f24e274]: Create a new file, failing if the file already exists. The check for the existence of the file and the creation of the file if it does not exist is atomic with respect to other file system operations.
                - listitem [ref=f24e275]:
                  - generic [ref=f24e276]:
                    - heading "DELETE_ON_CLOSE" [level=3] [ref=f24e277]
                    - generic [ref=f24e278]:
                      - text: public static final
                      - link "StandardOpenOption" [ref=f24e280] [cursor=pointer]:
                        - /url: StandardOpenOption.html
                      - text: DELETE_ON_CLOSE
                    - generic [ref=f24e281]:
                      - text: Delete on close. When this option is present then the implementation makes a
                      - emphasis [ref=f24e282]: best effort
                      - text: attempt to delete the file when closed by the appropriate
                      - code [ref=f24e283]: close
                      - text: method. If the
                      - code [ref=f24e284]: close
                      - text: method is not invoked then a
                      - emphasis [ref=f24e285]: best effort
                      - text: attempt is made to delete the file when the Java virtual machine terminates (either normally, as defined by the Java Language Specification, or where possible, abnormally). This option is primarily intended for use with
                      - emphasis [ref=f24e286]: work files
                      - text: that are used solely by a single instance of the Java virtual machine. This option is not recommended for use when opening files that are open concurrently by other entities. Many of the details as to when and how the file is deleted are implementation specific and therefore not specified. In particular, an implementation may be unable to guarantee that it deletes the expected file when replaced by an attacker while the file is open. Consequently, security sensitive applications should take care when using this option.
                      - paragraph [ref=f24e287]:
                        - text: For security reasons, this option may imply the
                        - link [ref=f24e288] [cursor=pointer]:
                          - /url: LinkOption.html#NOFOLLOW_LINKS
                          - code [ref=f24e289]: LinkOption.NOFOLLOW_LINKS
                        - text: option. In other words, if the option is present when opening an existing file that is a symbolic link then it may fail (by throwing
                        - link [ref=f24e290] [cursor=pointer]:
                          - /url: ../../io/IOException.html
                          - code [ref=f24e291]: IOException
                        - text: ).
                - listitem [ref=f24e292]:
                  - generic [ref=f24e293]:
                    - heading "SPARSE" [level=3] [ref=f24e294]
                    - generic [ref=f24e295]:
                      - text: public static final
                      - link "StandardOpenOption" [ref=f24e297] [cursor=pointer]:
                        - /url: StandardOpenOption.html
                      - text: SPARSE
                    - generic [ref=f24e298]:
                      - text: Sparse file. When used with the
                      - link [ref=f24e299] [cursor=pointer]:
                        - /url: "#CREATE_NEW"
                        - code [ref=f24e300]: CREATE_NEW
                      - text: option then this option provides a
                      - emphasis [ref=f24e301]: hint
                      - text: that the new file will be sparse. The option is ignored when the file system does not support the creation of sparse files.
                - listitem [ref=f24e302]:
