            - /url: "#bib.bib19"
          - text: )
        - text: ). While SNRM employs sparsity to allow using inverted indexes, we relax this assumption and compare a (dense) BERT-based representation-focused model against our late-interaction ColBERT in our ablation experiments in §
        - link "4.4" [ref=f1e259] [cursor=pointer]:
