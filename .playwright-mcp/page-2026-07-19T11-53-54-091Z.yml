          - link "2018" [ref=f1e193] [cursor=pointer]:
            - /url: "#bib.bib42"
          - text: )
        - text: ", greatly reducing the computational load per query. In this work, we observe that the fine-grained matching of interaction-based models and the pre-computation of document representations of representation-based models can be combined by retaining yet judiciously delaying the query–document interaction. Figure"
        - link "2" [ref=f1e194] [cursor=pointer]:
          - /url: "#S0.F2"
        - text: (d) illustrates an architecture that precisely does so. As illustrated, every query embedding interacts with all document embeddings via a MaxSim operator, which computes maximum similarity (e.g., cosine similarity), and the scalar outputs of these operators are summed across query terms. This paradigm allows ColBERT to exploit deep LM-based representations while shifting the cost of encoding documents offline and amortizing the cost of encoding the query once across all ranked documents. Additionally, it enables ColBERT to leverage vector-similarity search indexes (e.g.,
        - generic [ref=f1e195]:
