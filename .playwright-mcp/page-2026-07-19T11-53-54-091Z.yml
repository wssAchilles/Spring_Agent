    - generic [ref=f1e1778]:
      - heading "5. Conclusions" [level=2] [ref=f1e1779]:
        - generic [ref=f1e1780]: "5."
        - text: Conclusions
      - paragraph [ref=f1e1782]:
        - text: In this paper, we introduced ColBERT, a novel ranking model that employs contextualized late interaction over deep LMs (in particular, BERT) for efficient retrieval. By independently encoding queries and documents into fine-grained representations that interact via cheap and pruning-friendly computations, ColBERT can leverage the expressiveness of deep LMs while greatly speeding up query processing. In addition, doing so allows using ColBERT for end-to-end neural retrieval directly from a large document collection. Our results show that ColBERT is more than 170
        - math [ref=f1e1783]:
          - generic [ref=f1e1784]: ×
        - text: faster and requires 14,000
        - math [ref=f1e1786]:
          - generic [ref=f1e1787]: ×
        - text: fewer FLOPs/query than existing BERT-based models, all while only minimally impacting quality and while outperforming every non-BERT baseline.
      - paragraph [ref=f1e1790]: Acknowledgments. OK was supported by the Eltoukhy Family Graduate Fellowship at the Stanford School of Engineering. This research was supported in part by affiliate members and other supporters of the Stanford DAWN project—Ant Financial, Facebook, Google, Infosys, NEC, and VMware—as well as Cisco, SAP, and the NSF under CAREER grant CNS-1651570. Any opinions, findings, and conclusions or recommendations expressed in this material are those of the authors and do not necessarily reflect the views of the National Science Foundation.
