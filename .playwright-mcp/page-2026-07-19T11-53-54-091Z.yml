      - paragraph [ref=f1e264]:
        - text: Language Model Pretraining for IR. Recent work in NLU emphasizes the importance pre-training language representation models in an unsupervised fashion before subsequently fine-tuning them on downstream tasks. A notable example is BERT
        - generic [ref=f1e265]:
          - text: (Devlin et al.,
          - link "2018" [ref=f1e266] [cursor=pointer]:
            - /url: "#bib.bib6"
          - text: )
        - text: ", a bi-directional transformer-based language model whose fine-tuning advanced the state of the art on various NLU benchmarks. Nogueira et al."
        - generic [ref=f1e267]:
          - text: (Nogueira and Cho,
          - link "2019" [ref=f1e268] [cursor=pointer]:
            - /url: "#bib.bib26"
          - text: )
        - text: ", MacAvaney et al."
        - generic [ref=f1e269]:
          - text: (MacAvaney et al.,
          - link "2019" [ref=f1e270] [cursor=pointer]:
            - /url: "#bib.bib19"
          - text: )
        - text: ", and Dai & Callan"
        - generic [ref=f1e271]:
          - text: (Dai and Callan,
          - link "2019b" [ref=f1e272] [cursor=pointer]:
            - /url: "#bib.bib4"
          - text: )
        - text: investigate incorporating such LMs (mainly BERT, but also ELMo
        - generic [ref=f1e273]:
          - text: (Peters et al.,
          - link "2018" [ref=f1e274] [cursor=pointer]:
            - /url: "#bib.bib30"
          - text: )
        - text: ) on different ranking datasets. As illustrated in Figure
        - link "2" [ref=f1e275] [cursor=pointer]:
          - /url: "#S0.F2"
        - text: (c), the common approach (and the one adopted by Nogueira et al. on MS MARCO and TREC CAR) is to feed the query–document pair through BERT and use an MLP on top of BERT’s [CLS] output token to produce a relevance score. Subsequent work by Nogueira et al.
        - generic [ref=f1e276]:
          - text: (Nogueira et al.,
          - link "2019b" [ref=f1e277] [cursor=pointer]:
            - /url: "#bib.bib28"
          - text: )
        - text: introduced duoBERT, which fine-tunes BERT to compare the relevance of a pair of documents given a query. Relative to their single-document BERT, this gives duoBERT a 1% MRR@10 advantage on MS MARCO while increasing the cost by at least 1.4
        - math [ref=f1e278]:
          - generic [ref=f1e279]: ×
        - text: .
      - paragraph [ref=f1e282]:
        - text: BERT Optimizations. As discussed in §
        - link "1" [ref=f1e283] [cursor=pointer]:
          - /url: "#S1"
        - text: ", these LM-based rankers can be highly expensive in practice. While ongoing efforts in the NLU literature for distilling"
