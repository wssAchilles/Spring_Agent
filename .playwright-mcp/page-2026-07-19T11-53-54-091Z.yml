            - /url: "#bib.bib20"
          - text: )
        - text: BERT can be instrumental in narrowing this gap, they generally achieve significantly smaller speedups than our re-designed architecture for IR, due to their generic nature, and more aggressive optimizations often come at the cost of lower quality.
      - paragraph [ref=f1e292]:
        - text: Efficient NLU-based Models. Recently, a direction emerged that employs expensive NLU computation offline. This includes doc2query
        - generic [ref=f1e293]:
          - text: (Nogueira et al.,
          - link "2019c" [ref=f1e294] [cursor=pointer]:
            - /url: "#bib.bib29"
          - text: )
        - text: and DeepCT
        - generic [ref=f1e295]:
          - text: (Dai and Callan,
          - link "2019a" [ref=f1e296] [cursor=pointer]:
            - /url: "#bib.bib3"
          - text: )
        - text: . The doc2query model expands each document with a pre-defined number of synthetic queries queries generated by a seq2seq transformer model that is trained to generate queries given a document. It then relies on a BM25 index for retrieval from the (expanded) documents. DeepCT uses BERT to produce the term frequency component of BM25 in a context-aware manner, essentially representing a feasible realization of the term-independence assumption with neural networks
        - generic [ref=f1e297]:
          - text: (Mitra et al.,
          - link "2019" [ref=f1e298] [cursor=pointer]:
            - /url: "#bib.bib24"
          - text: )
