      - paragraph [ref=f1e181]:
        - text: These increasingly expressive architectures are in tension. While interaction-based models (i.e., Figure
        - link "2" [ref=f1e182] [cursor=pointer]:
          - /url: "#S0.F2"
        - text: (b) and (c)) tend to be superior for IR tasks
