        - paragraph [ref=f1e1473]:
          - text: We now proceed to study the results, which are reported in Table
          - link "1" [ref=f1e1474] [cursor=pointer]:
            - /url: "#S4.T1"
          - text: . To begin with, we notice the fast progress from KNRM in 2017 to the BERT-based models in 2019, manifesting itself in over 16% increase in MRR@10. As described in §
          - link "1" [ref=f1e1475] [cursor=pointer]:
            - /url: "#S1"
          - text: ", the simultaneous increase in computational cost is difficult to miss. Judging by their rather monotonic pattern of increasingly larger cost and higher effectiveness, these results appear to paint a picture where expensive models are necessary for high-quality ranking."
        - paragraph [ref=f1e1477]:
          - text: In contrast with this trend, ColBERT (which employs late interaction over BERT
          - math [ref=f1e1478]:
