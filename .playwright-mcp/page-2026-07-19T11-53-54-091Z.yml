            - /url: "#bib.bib9"
          - text: ; Mitra et al.,
          - link "2018" [ref=f1e185] [cursor=pointer]:
            - /url: "#bib.bib22"
          - text: )
        - text: ", a representation-focused model—by isolating the computations among"
        - math [ref=f1e186]:
