        - paragraph [ref=f1e1686]:
          - text: The results from §
          - link "4.2" [ref=f1e1687] [cursor=pointer]:
            - /url: "#S4.SS2"
          - text: indicate that ColBERT is highly effective despite the low cost and simplicity of its late interaction mechanism. To better understand the source of this effectiveness, we examine a number of important details in ColBERT’s interaction and encoder architecture. For this ablation, we report MRR@10 on the validation set of MS MARCO in Figure
          - link "5" [ref=f1e1688] [cursor=pointer]:
            - /url: "#S4.F5"
          - text: ", which shows our main re-ranking ColBERT model [E], with MRR@10 of 34.9%."
        - paragraph [ref=f1e1690]:
          - text: "Due to the cost of training all models, we train a copy of our main model that retains only the first 5 layers of BERT out of 12 (i.e., model [D]) and similarly train all our ablation models for 200k iterations with five BERT layers. To begin with, we ask if the fine-granular interaction in late interaction is necessary. Model [A] tackles this question: it uses BERT to produce a single embedding vector for the query and another for the document, extracted from BERT’s [CLS] contextualized embedding and expanded through a linear layer to dimension 4096 (which equals"
          - math [ref=f1e1691]:
            - generic [ref=f1e1693]:
              - generic [ref=f1e1694]:
                - generic [ref=f1e1695]:
                  - generic [ref=f1e1696]: "N"
                  - generic [ref=f1e1697]: q
                - generic [ref=f1e1698]: ×
