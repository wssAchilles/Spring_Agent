        - text: "&"
        - link "4.3" [ref=f1e211] [cursor=pointer]:
          - /url: "#S4.SS3"
        - text: "). ColBERT’s indexing—the only time it needs to feed documents through BERT—is also practical: it can index the MS MARCO collection of 9M passages in about 3 hours using a single server with four GPUs (§"
        - link "4.5" [ref=f1e212] [cursor=pointer]:
          - /url: "#S4.SS5"
        - text: ), retaining its effectiveness with a space footprint of as little as few tens of GiBs. Our extensive ablation study (§
        - link "4.4" [ref=f1e213] [cursor=pointer]:
