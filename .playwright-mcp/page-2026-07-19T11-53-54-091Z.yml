        - paragraph [ref=f1e1626]:
          - text: Having studied our results on MS MARCO, we now consider TREC CAR, whose official metric is MAP. Results are summarized in Table
          - link "3" [ref=f1e1627] [cursor=pointer]:
            - /url: "#S4.T3"
          - text: ", which includes a number of important baselines (BM25, doc2query, and DeepCT) in addition to re-ranking baselines that have been tested on this dataset. These results directly mirror those with MS MARCO."
      - generic [ref=f1e1628]:
        - heading "4.3. End-to-end Top- Retrieval" [level=3] [ref=f1e1629]:
          - generic [ref=f1e1630]: 4.3.
          - text: End-to-end Top-
          - math [ref=f1e1631]:
            - generic [ref=f1e1632]: k
          - text: Retrieval
        - paragraph [ref=f1e1635]:
          - text: Beyond cheap re-ranking, ColBERT is amenable to top-
          - math [ref=f1e1636]:
            - generic [ref=f1e1637]: k
          - text: retrieval directly from a full collection. Table
          - link "2" [ref=f1e1639] [cursor=pointer]:
            - /url: "#S4.T2"
          - text: considers full retrieval, wherein each model retrieves the top-1000 documents directly from MS MARCO’s 8.8M documents per query. In addition to MRR@10 and latency in milliseconds, the table reports Recall@50, Recall@200, and Recall@1000, important metrics for a full-retrieval model that essentially filters down a large collection on a per-query basis.
        - paragraph [ref=f1e1641]:
          - text: We compare against BM25, in particular MS MARCO’s official BM25 ranking as well as a well-tuned baseline based on the Anserini toolkit.
          - superscript [ref=f1e1643]: "7"
          - text: While many other traditional models exist, we are not aware of any that substantially outperform Anserini’s BM25 implementation (e.g., see RM3 in
          - generic [ref=f1e1644]:
            - text: (Nogueira et al.,
            - link "2019c" [ref=f1e1645] [cursor=pointer]:
              - /url: "#bib.bib29"
            - text: )
          - text: ", LMDir in"
          - generic [ref=f1e1646]:
            - text: (Dai and Callan,
            - link "2019a" [ref=f1e1647] [cursor=pointer]:
              - /url: "#bib.bib3"
            - text: )
          - text: ", or Microsoft’s proprietary feature-based RankSVM on the leaderboard)."
        - paragraph [ref=f1e1649]:
          - text: We also compare against doc2query, DeepCT, and docTTTTTquery. All three rely on a traditional bag-of-words model (primarily BM25) for retrieval. Crucially, however, they re-weigh the frequency of terms per document and/or expand the set of terms in each document before building the BM25 index. In particular, doc2query expands each document with a pre-defined number of synthetic queries generated by a seq2seq transformer model (which docTTTTquery replaced with a pre-trained language model, T5
          - generic [ref=f1e1650]:
            - text: (Raffel et al.,
            - link "2019" [ref=f1e1651] [cursor=pointer]:
              - /url: "#bib.bib32"
            - text: )
          - text: ). In contrast, DeepCT uses BERT to produce the term frequency component of BM25 in a context-aware manner.
        - paragraph [ref=f1e1653]:
          - text: For the latency of Anserini’s BM25, doc2query, and docTTTTquery, we use the authors’
          - generic [ref=f1e1654]:
            - text: (Nogueira et al.,
            - link "2019c" [ref=f1e1655] [cursor=pointer]:
              - /url: "#bib.bib29"
            - text: ","
            - link "a" [ref=f1e1656] [cursor=pointer]:
              - /url: "#bib.bib27"
            - text: )
          - text: Anserini-based implementation. While this implementation supports multi-threading, it only utilizes parallelism across different queries. We thus report single-threaded latency for these models, noting that simply parallelizing their computation over shards of the index can substantially decrease their already-low latency. For DeepCT, we only estimate its latency using that of BM25 (as denoted by (est.) in the table), since DeepCT re-weighs BM25’s term frequency without modifying the index otherwise.
          - superscript [ref=f1e1658]: "8"
          - text: As discussed in §
          - link "4.1" [ref=f1e1659] [cursor=pointer]:
            - /url: "#S4.SS1"
          - text: ", we use ColBERT"
          - math [ref=f1e1660]:
            - generic [ref=f1e1661]: L2
          - text: for end-to-end retrieval, which employs negative squared L2 distance as its vector-similarity function. For its latency, we measure the time for faiss-based candidate filtering and the subsequent re-ranking. In this experiment, faiss uses all available CPU cores.
        - paragraph [ref=f1e1665]:
          - text: Looking at Table
          - link "2" [ref=f1e1666] [cursor=pointer]:
            - /url: "#S4.T2"
          - text: ", we first see Anserini’s BM25 baseline at 18.7 MRR@10, noticing its very low latency as implemented in Anserini (which extends the well-known Lucene system), owing to both very cheap operations and decades of bag-of-words top-"
          - math [ref=f1e1667]:
            - generic [ref=f1e1668]: k
          - text: retrieval optimizations. The three subsequent baselines, namely doc2query, DeepCT, and docTTTTquery, each brings a decisive enhancement to effectiveness. These improvements come at negligible overheads in latency, since these baselines ultimately rely on BM25-based retrieval. The most effective among these three, docTTTTquery, demonstrates a massive 9% gain over vanilla BM25 by fine-tuning the recent language model T5.
        - paragraph [ref=f1e1671]:
          - text: Shifting our attention to ColBERT’s end-to-end retrieval effectiveness, we see its major gains in MRR@10 over all of these end-to-end models. In fact, using ColBERT in the end-to-end setup is superior in terms of MRR@10 to re-ranking with the same model due to the improved recall. Moving beyond MRR@10, we also see large gains in Recall@
          - math [ref=f1e1672]:
            - generic [ref=f1e1673]: k
          - text: for
          - math [ref=f1e1675]:
            - generic [ref=f1e1676]: k
          - text: equals to 50, 200, and 1000. For instance, its Recall@50 actually exceeds the official BM25’s Recall@1000 and even all but docTTTTTquery’s Recall@200, emphasizing the value of end-to-end retrieval (instead of just re-ranking) with ColBERT.
      - generic [ref=f1e1678]:
