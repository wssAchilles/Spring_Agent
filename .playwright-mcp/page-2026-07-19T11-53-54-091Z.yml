      - paragraph [ref=f1e304]:
        - text: Concurrently with our drafting of this paper, Hofstätter et al.
        - generic [ref=f1e305]:
          - text: (Hofstätter et al.,
          - link "2019b" [ref=f1e306] [cursor=pointer]:
            - /url: "#bib.bib12"
          - text: )
        - text: "published their Transformer-Kernel (TK) model. At a high level, TK improves the KNRM architecture described earlier: while KNRM employs kernel pooling on top of word-embedding-based interaction, TK uses a Transformer"
        - generic [ref=f1e307]:
          - text: (Vaswani et al.,
          - link "2017" [ref=f1e308] [cursor=pointer]:
            - /url: "#bib.bib35"
          - text: )
        - text: component for contextually encoding queries and documents before kernel pooling. TK establishes a new state-of-the-art for non-BERT models on MS MARCO (Dev); however, the best non-ensemble MRR@10 it achieves is 31% while ColBERT reaches up to 36%. Moreover, due to indexing document representations offline and employing a MaxSim-based late interaction mechanism, ColBERT is much more scalable, enabling end-to-end retrieval which is not supported by TK.
