        - text: results directly from a large document collection, substantially improving recall over models that only re-rank the output of term-based retrieval.
      - paragraph [ref=f1e202]:
        - text: As Figure
        - link "1" [ref=f1e203] [cursor=pointer]:
          - /url: "#S0.F1"
        - text: illustrates, ColBERT can serve queries in tens or few hundreds of milliseconds. For instance, when used for re-ranking as in “ColBERT (re-rank)”, it delivers over 170
        - math [ref=f1e204]:
          - generic [ref=f1e205]: ×
        - text: speedup (and requires 14,000
        - math [ref=f1e207]:
          - generic [ref=f1e208]: ×
        - text: fewer FLOPs) relative to existing BERT-based models, while being more effective than every non-BERT baseline (§
        - link "4.2" [ref=f1e210] [cursor=pointer]:
