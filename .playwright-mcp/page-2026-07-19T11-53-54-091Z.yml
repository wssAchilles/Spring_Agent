            - text: datasets. Both of these recent datasets provide large training data of the scale that facilitates training and evaluating deep neural networks. We describe both in detail below.
          - paragraph [ref=f1e1341]: MS MARCO. MS MARCO is a dataset (and a corresponding competition) introduced by Microsoft in 2016 for reading comprehension and adapted in 2018 for retrieval. It is a collection of 8.8M passages from Web pages, which were gathered from Bing’s results to 1M real-world queries. Each query is associated with sparse relevance judgements of one (or very few) documents marked as relevant and no documents explicitly indicated as irrelevant. Per the official evaluation, we use MRR@10 to measure effectiveness.
          - paragraph [ref=f1e1343]:
            - text: We use three sets of queries for evaluation. The official development and evaluation sets contain roughly 7k queries. However, the relevance judgements of the evaluation set are held-out by Microsoft and effectiveness results can only be obtained by submitting to the competition’s organizers. We submitted our main re-ranking ColBERT model for the results in §
            - link "4.2" [ref=f1e1344] [cursor=pointer]:
              - /url: "#S4.SS2"
            - text: . In addition, the collection includes roughly 55k queries (with labels) that are provided as additional validation data. We re-purpose a random sample of 5k queries among those (i.e., ones not in our development or training sets) as a “local” evaluation set. Along with the official development set, we use this held-out set for testing our models as well as baselines in §
            - link "4.3" [ref=f1e1345] [cursor=pointer]:
              - /url: "#S4.SS3"
            - text: . We do so to avoid submitting multiple variants of the same model at once, as the organizers discourage too many submissions by the same team.
          - paragraph [ref=f1e1347]:
            - text: TREC CAR. Introduced by Dietz
            - generic [ref=f1e1348]:
              - text: (Dietz et al.,
              - link "2017" [ref=f1e1349] [cursor=pointer]:
                - /url: "#bib.bib7"
              - text: )
            - text: et al. in 2017, TREC CAR is a synthetic dataset based on Wikipedia that consists of about 29M passages. Similar to related work
            - generic [ref=f1e1350]:
              - text: (Nogueira and Cho,
              - link "2019" [ref=f1e1351] [cursor=pointer]:
                - /url: "#bib.bib26"
              - text: )
            - text: ", we use the first four of five pre-defined folds for training and the fifth for validation. This amounts to roughly 3M queries generated by concatenating the title of a Wikipedia page with the heading of one of its sections. That section’s passages are marked as relevant to the corresponding query. Our evaluation is conducted on the test set used in TREC 2017 CAR, which contains 2,254 queries."
