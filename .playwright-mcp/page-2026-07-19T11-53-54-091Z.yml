            - text: ; Nogueira et al.,
            - link "2019b" [ref=f1e1488] [cursor=pointer]:
              - /url: "#bib.bib28"
            - text: )
          - text: and is only marginally less effective than BERT
          - math [ref=f1e1489]:
            - generic [ref=f1e1490]: large
          - text: and our training of BERT
          - math [ref=f1e1493]:
            - generic [ref=f1e1494]: base
          - text: (described above). While highly competitive in effectiveness, ColBERT is orders of magnitude cheaper than BERT
          - math [ref=f1e1497]:
            - generic [ref=f1e1498]: base
          - text: ", in particular, by over 170"
          - math [ref=f1e1501]:
            - generic [ref=f1e1502]: ×
          - text: in latency and 13,900
          - math [ref=f1e1504]:
            - generic [ref=f1e1505]: ×
          - text: in FLOPs. This highlights the expressiveness of our proposed late interaction mechanism, particularly when coupled with a powerful pre-trained LM like BERT. While ColBERT’s re-ranking latency is slightly higher than the non-BERT re-ranking models shown (i.e., by 10s of milliseconds), this difference is explained by the time it takes to gather, stack, and transfer the document embeddings to the GPU. In particular, the query encoding and interaction in ColBERT consume only 13 milliseconds of its total execution time. We note that ColBERT’s latency and FLOPs can be considerably reduced by padding queries to a shorter length, using smaller vector dimensions (the MRR@10 of which is tested in §
          - link "4.5" [ref=f1e1507] [cursor=pointer]:
            - /url: "#S4.SS5"
          - text: ), employing quantization of the document vectors, and storing the embeddings on GPU if sufficient memory exists. We leave these directions for future work.
