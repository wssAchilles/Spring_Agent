                        - text: option is specified, and the target file already exists, then it is replaced if it is not a non-empty directory. If the target file exists and is a symbolic link, then the symbolic link is replaced. In this release, the
                        - code [ref=f23e3410]: REPLACE_EXISTING
                        - text: option is the only option required to be supported by this method. Additional options may be supported in future releases.
                      - paragraph [ref=f23e3411]: If an I/O error occurs reading from the input stream or writing to the file, then it may do so after the target file has been created and after some bytes have been read or written. Consequently the input stream may not be at end of stream and may be in an inconsistent state. It is strongly recommended that the input stream be promptly closed if an I/O error occurs.
                      - paragraph [ref=f23e3412]: This method may block indefinitely reading from the input stream (or writing to the file). The behavior for the case that the input stream is asynchronously closed or the thread interrupted during the copy is highly input stream and file system provider specific and therefore not specified.
                      - paragraph [ref=f23e3413]: "Usage example: Suppose we want to capture a web page and save it to a file:"
