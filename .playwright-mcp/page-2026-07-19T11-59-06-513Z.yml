                        - code [ref=f23e2984]: "false"
                        - text: . As with the
                        - code [ref=f23e2985]: exists
                        - text: method, the result of this method is immediately outdated. If this method indicates the file does exist then there is no guarantee that a subsequent attempt to create the file will succeed. Care should be taken when using this method in security sensitive applications.
