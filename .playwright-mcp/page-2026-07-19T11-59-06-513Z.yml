                        - text: . Some file systems maintain special links to the directory itself and the directory's parent directory. Entries representing these links are not included.
                      - paragraph [ref=f23e3985]: The stream is weakly consistent. It is thread safe but does not freeze the directory while iterating, so it may (or may not) reflect updates to the directory that occur after returning from this method.
                      - paragraph [ref=f23e3986]: The returned stream contains a reference to an open directory. The directory is closed by closing the stream.
                      - paragraph [ref=f23e3987]: Operating on a closed stream behaves as if the end of stream has been reached. Due to read-ahead, one or more elements may be returned after the stream has been closed.
