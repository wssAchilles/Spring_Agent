                    - generic [ref=f23e3085]:
                      - text: Walks a file tree.
                      - paragraph [ref=f23e3086]:
                        - text: This method walks a file tree rooted at a given starting file. The file tree traversal is
                        - emphasis [ref=f23e3087]: depth-first
                        - text: with the given
                        - link [ref=f23e3088] [cursor=pointer]:
                          - /url: FileVisitor.html
                          - code [ref=f23e3089]: FileVisitor
                        - text: invoked for each file encountered. File tree traversal completes when all accessible files in the tree have been visited, or a visit method returns a result of
                        - link [ref=f23e3090] [cursor=pointer]:
                          - /url: FileVisitResult.html#TERMINATE
                          - code [ref=f23e3091]: TERMINATE
                        - text: . Where a visit method terminates due an
                        - code [ref=f23e3092]: IOException
                        - text: ", an uncaught error, or runtime exception, then the traversal is terminated and the error or exception is propagated to the caller of this method."
                      - paragraph [ref=f23e3093]:
                        - text: For each file encountered this method attempts to read its
                        - link [ref=f23e3094] [cursor=pointer]:
                          - /url: attribute/BasicFileAttributes.html
                          - code [ref=f23e3095]: BasicFileAttributes
                        - text: . If the file is not a directory then the
                        - link [ref=f23e3096] [cursor=pointer]:
                          - /url: FileVisitor.html#visitFile(T,java.nio.file.attribute.BasicFileAttributes)
                          - code [ref=f23e3097]: visitFile
                        - text: method is invoked with the file attributes. If the file attributes cannot be read, due to an I/O exception, then the
                        - link [ref=f23e3098] [cursor=pointer]:
                          - /url: FileVisitor.html#visitFileFailed(T,java.io.IOException)
                          - code [ref=f23e3099]: visitFileFailed
                        - text: method is invoked with the I/O exception.
                      - paragraph [ref=f23e3100]:
                        - text: Where the file is a directory, and the directory could not be opened, then the
                        - code [ref=f23e3101]: visitFileFailed
                        - text: method is invoked with the I/O exception, after which, the file tree walk continues, by default, at the next
                        - emphasis [ref=f23e3102]: sibling
                        - text: of the directory.
                      - paragraph [ref=f23e3103]:
                        - text: Where the directory is opened successfully, then the entries in the directory, and their
                        - emphasis [ref=f23e3104]: descendants
                        - text: are visited. When all entries have been visited, or an I/O error occurs during iteration of the directory, then the directory is closed and the visitor's
                        - link [ref=f23e3105] [cursor=pointer]:
                          - /url: FileVisitor.html#postVisitDirectory(T,java.io.IOException)
                          - code [ref=f23e3106]: postVisitDirectory
                        - text: method is invoked. The file tree walk then continues, by default, at the next
                        - emphasis [ref=f23e3107]: sibling
                        - text: of the directory.
                      - paragraph [ref=f23e3108]:
                        - text: By default, symbolic links are not automatically followed by this method. If the
                        - code [ref=f23e3109]: options
                        - text: parameter contains the
                        - link [ref=f23e3110] [cursor=pointer]:
                          - /url: FileVisitOption.html#FOLLOW_LINKS
                          - code [ref=f23e3111]: FOLLOW_LINKS
                        - text: option then symbolic links are followed. When following links, and the attributes of the target cannot be read, then this method attempts to get the
                        - code [ref=f23e3112]: BasicFileAttributes
                        - text: of the link. If they can be read then the
                        - code [ref=f23e3113]: visitFile
                        - text: method is invoked with the attributes of the link (otherwise the
                        - code [ref=f23e3114]: visitFileFailed
                        - text: method is invoked as specified above).
                      - paragraph [ref=f23e3115]:
                        - text: If the
                        - code [ref=f23e3116]: options
                        - text: parameter contains the
                        - link [ref=f23e3117] [cursor=pointer]:
                          - /url: FileVisitOption.html#FOLLOW_LINKS
                          - code [ref=f23e3118]: FOLLOW_LINKS
                        - text: option then this method keeps track of directories visited so that cycles can be detected. A cycle arises when there is an entry in a directory that is an ancestor of the directory. Cycle detection is done by recording the
                        - link [ref=f23e3119] [cursor=pointer]:
                          - /url: attribute/BasicFileAttributes.html#fileKey()
                          - code [ref=f23e3120]: file-key
                        - text: of directories, or if file keys are not available, by invoking the
                        - link [ref=f23e3121] [cursor=pointer]:
                          - /url: "#isSameFile(java.nio.file.Path,java.nio.file.Path)"
                          - code [ref=f23e3122]: isSameFile
                        - text: method to test if a directory is the same file as an ancestor. When a cycle is detected it is treated as an I/O error, and the
                        - link [ref=f23e3123] [cursor=pointer]:
                          - /url: FileVisitor.html#visitFileFailed(T,java.io.IOException)
                          - code [ref=f23e3124]: visitFileFailed
                        - text: method is invoked with an instance of
                        - link [ref=f23e3125] [cursor=pointer]:
                          - /url: FileSystemLoopException.html
                          - code [ref=f23e3126]: FileSystemLoopException
                        - text: .
                      - paragraph [ref=f23e3127]:
                        - text: The
                        - code [ref=f23e3128]: maxDepth
                        - text: parameter is the maximum number of levels of directories to visit. A value of
                        - code [ref=f23e3129]: "0"
                        - text: means that only the starting file is visited, unless denied by the security manager. A value of
                        - link [ref=f23e3130] [cursor=pointer]:
                          - /url: ../../lang/Integer.html#MAX_VALUE
                          - code [ref=f23e3131]: MAX_VALUE
                        - text: may be used to indicate that all levels should be visited. The
                        - code [ref=f23e3132]: visitFile
                        - text: method is invoked for all files, including directories, encountered at
                        - code [ref=f23e3133]: maxDepth
                        - text: ", unless the basic file attributes cannot be read, in which case the"
                        - code [ref=f23e3134]: visitFileFailed
                        - text: method is invoked.
                      - paragraph [ref=f23e3135]:
                        - text: If a visitor returns a result of
                        - code [ref=f23e3136]: "null"
                        - text: then
                        - code [ref=f23e3137]: NullPointerException
                        - text: is thrown.
                      - paragraph [ref=f23e3138]: When a security manager is installed and it denies access to a file (or directory), then it is ignored and the visitor is not invoked for that file (or directory).
