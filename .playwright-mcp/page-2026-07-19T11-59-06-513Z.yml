                    - generic [ref=f23e903]:
                      - text: Opens or creates a file, returning an output stream that may be used to write bytes to the file. The resulting stream will not be buffered. The stream will be safe for access by multiple concurrent threads. Whether the returned stream is asynchronously closeable and/or interruptible is highly file system provider specific and therefore not specified.
                      - paragraph [ref=f23e904]:
                        - text: This method opens or creates a file in exactly the manner specified by the
                        - link [ref=f23e905] [cursor=pointer]:
                          - /url: "#newByteChannel(java.nio.file.Path,java.util.Set,java.nio.file.attribute.FileAttribute...)"
                          - code [ref=f23e906]: newByteChannel
                        - text: method with the exception that the
                        - link [ref=f23e907] [cursor=pointer]:
                          - /url: StandardOpenOption.html#READ
                          - code [ref=f23e908]: READ
                        - text: option may not be present in the array of options. If no options are present then this method works as if the
                        - link [ref=f23e909] [cursor=pointer]:
                          - /url: StandardOpenOption.html#CREATE
                          - code [ref=f23e910]: CREATE
                        - text: ","
                        - link [ref=f23e911] [cursor=pointer]:
