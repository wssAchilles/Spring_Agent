                    - generic [ref=f23e2232]:
                      - text: Probes the content type of a file.
                      - paragraph [ref=f23e2233]:
                        - text: This method uses the installed
                        - link [ref=f23e2234] [cursor=pointer]:
                          - /url: spi/FileTypeDetector.html
                          - code [ref=f23e2235]: FileTypeDetector
                        - text: implementations to probe the given file to determine its content type. Each file type detector's
                        - link [ref=f23e2236] [cursor=pointer]:
                          - /url: spi/FileTypeDetector.html#probeContentType(java.nio.file.Path)
                          - code [ref=f23e2237]: probeContentType
                        - text: is invoked, in turn, to probe the file type. If the file is recognized then the content type is returned. If the file is not recognized by any of the installed file type detectors then a system-default file type detector is invoked to guess the content type.
                      - paragraph [ref=f23e2238]:
                        - text: A given invocation of the Java virtual machine maintains a system-wide list of file type detectors. Installed file type detectors are loaded using the service-provider loading facility defined by the
                        - link [ref=f23e2239] [cursor=pointer]:
                          - /url: ../../util/ServiceLoader.html
                          - code [ref=f23e2240]: ServiceLoader
                        - text: class. Installed file type detectors are loaded using the system class loader. If the system class loader cannot be found then the platform class loader is used. File type detectors are typically installed by placing them in a JAR file on the application class path, the JAR file contains a provider-configuration file named
                        - code [ref=f23e2241]: java.nio.file.spi.FileTypeDetector
                        - text: in the resource directory
                        - code [ref=f23e2242]: META-INF/services
                        - text: ", and the file lists one or more fully-qualified names of concrete subclass of"
                        - code [ref=f23e2243]: FileTypeDetector
                        - text: that have a zero argument constructor. If the process of locating or instantiating the installed file type detectors fails then an unspecified error is thrown. The ordering that installed providers are located is implementation specific.
                      - paragraph [ref=f23e2244]:
                        - text: The return value of this method is the string form of the value of a Multipurpose Internet Mail Extension (MIME) content type as defined by
                        - 'link "RFC 2045: Multipurpose Internet Mail Extensions (MIME) Part One: Format of Internet Message Bodies" [ref=f23e2245] [cursor=pointer]':
                          - /url: http://www.ietf.org/rfc/rfc2045.txt
                        - text: . The string is guaranteed to be parsable according to the grammar in the RFC.
