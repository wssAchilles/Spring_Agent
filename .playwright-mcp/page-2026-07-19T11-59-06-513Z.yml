                            - cell [ref=f23e1953]:
                              - text: The move is performed as an atomic file system operation and all other options are ignored. If the target file exists then it is implementation specific if the existing file is replaced or this method fails by throwing an
                              - link [ref=f23e1954] [cursor=pointer]:
                                - /url: ../../io/IOException.html
                                - code [ref=f23e1955]: IOException
                              - text: . If the move cannot be performed as an atomic file system operation then
                              - link [ref=f23e1956] [cursor=pointer]:
                                - /url: AtomicMoveNotSupportedException.html
                                - code [ref=f23e1957]: AtomicMoveNotSupportedException
                              - text: is thrown. This can arise, for example, when the target location is on a different
                              - code [ref=f23e1958]: FileStore
                              - text: and would require that the file be copied, or target location is associated with a different provider to this object.
                      - paragraph
                      - paragraph [ref=f23e1959]: An implementation of this interface may support additional implementation specific options.
                      - paragraph [ref=f23e1960]:
                        - text: Moving a file will copy the
                        - link [ref=f23e1961] [cursor=pointer]:
