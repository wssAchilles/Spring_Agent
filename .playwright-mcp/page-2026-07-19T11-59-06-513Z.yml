                        - text: "- the path to the file to probe"
                      - term [ref=f23e2250]: "Returns:"
                      - definition [ref=f23e2251]:
                        - text: The content type of the file, or
                        - code [ref=f23e2252]: "null"
                        - text: if the content type cannot be determined
