                      - text: methods. The stream will be safe for access by multiple concurrent threads. Reading commences at the beginning of the file. Whether the returned stream is asynchronously closeable and/or interruptible is highly file system provider specific and therefore not specified.
                      - paragraph [ref=f23e864]:
                        - text: The
                        - code [ref=f23e865]: options
                        - text: parameter determines how the file is opened. If no options are present then it is equivalent to opening the file with the
