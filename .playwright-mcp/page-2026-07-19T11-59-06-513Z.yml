                          - code [ref=f23e912]: TRUNCATE_EXISTING
                        - text: ", and"
                        - link [ref=f23e913] [cursor=pointer]:
                          - /url: StandardOpenOption.html#WRITE
                          - code [ref=f23e914]: WRITE
                        - text: options are present. In other words, it opens the file for writing, creating the file if it doesn't exist, or initially truncating an existing
                        - link [ref=f23e915] [cursor=pointer]:
