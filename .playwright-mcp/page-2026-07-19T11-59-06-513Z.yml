                      - paragraph [ref=f23e4043]:
                        - text: The
                        - code [ref=f23e4044]: stream
                        - text: walks the file tree as elements are consumed. The
                        - code [ref=f23e4045]: Stream
                        - text: returned is guaranteed to have at least one element, the starting file itself. For each file visited, the stream attempts to read its
                        - link [ref=f23e4046] [cursor=pointer]:
                          - /url: attribute/BasicFileAttributes.html
                          - code [ref=f23e4047]: BasicFileAttributes
                        - text: . If the file is a directory and can be opened successfully, entries in the directory, and their
                        - emphasis [ref=f23e4048]: descendants
                        - text: will follow the directory in the stream as they are encountered. When all entries have been visited, then the directory is closed. The file tree walk then continues at the next
                        - emphasis [ref=f23e4049]: sibling
                        - text: of the directory.
                      - paragraph [ref=f23e4050]: The stream is weakly consistent. It does not freeze the file tree while iterating, so it may (or may not) reflect updates to the file tree that occur after returned from this method.
                      - paragraph [ref=f23e4051]:
                        - text: By default, symbolic links are not automatically followed by this method. If the
                        - code [ref=f23e4052]: options
                        - text: parameter contains the
                        - link [ref=f23e4053] [cursor=pointer]:
                          - /url: FileVisitOption.html#FOLLOW_LINKS
                          - code [ref=f23e4054]: FOLLOW_LINKS
                        - text: option then symbolic links are followed. When following links, and the attributes of the target cannot be read, then this method attempts to get the
                        - code [ref=f23e4055]: BasicFileAttributes
                        - text: of the link.
                      - paragraph [ref=f23e4056]:
                        - text: If the
                        - code [ref=f23e4057]: options
                        - text: parameter contains the
                        - link [ref=f23e4058] [cursor=pointer]:
                          - /url: FileVisitOption.html#FOLLOW_LINKS
                          - code [ref=f23e4059]: FOLLOW_LINKS
                        - text: option then the stream keeps track of directories visited so that cycles can be detected. A cycle arises when there is an entry in a directory that is an ancestor of the directory. Cycle detection is done by recording the
                        - link [ref=f23e4060] [cursor=pointer]:
                          - /url: attribute/BasicFileAttributes.html#fileKey()
                          - code [ref=f23e4061]: file-key
                        - text: of directories, or if file keys are not available, by invoking the
                        - link [ref=f23e4062] [cursor=pointer]:
                          - /url: "#isSameFile(java.nio.file.Path,java.nio.file.Path)"
                          - code [ref=f23e4063]: isSameFile
                        - text: method to test if a directory is the same file as an ancestor. When a cycle is detected it is treated as an I/O error with an instance of
                        - link [ref=f23e4064] [cursor=pointer]:
                          - /url: FileSystemLoopException.html
                          - code [ref=f23e4065]: FileSystemLoopException
                        - text: .
                      - paragraph [ref=f23e4066]:
                        - text: The
                        - code [ref=f23e4067]: maxDepth
                        - text: parameter is the maximum number of levels of directories to visit. A value of
                        - code [ref=f23e4068]: "0"
                        - text: means that only the starting file is visited, unless denied by the security manager. A value of
                        - link [ref=f23e4069] [cursor=pointer]:
                          - /url: ../../lang/Integer.html#MAX_VALUE
                          - code [ref=f23e4070]: MAX_VALUE
                        - text: may be used to indicate that all levels should be visited.
                      - paragraph [ref=f23e4071]: When a security manager is installed and it denies access to a file (or directory), then it is ignored and not included in the stream.
                      - paragraph [ref=f23e4072]: The returned stream contains references to one or more open directories. The directories are closed by closing the stream.
