                      - text: Copy a file to a target file.
                      - paragraph [ref=f23e1839]:
                        - text: This method copies a file to the target file with the
                        - code [ref=f23e1840]: options
                        - text: parameter specifying how the copy is performed. By default, the copy fails if the target file already exists or is a symbolic link, except if the source and target are the
                        - link [ref=f23e1841] [cursor=pointer]:
                          - /url: "#isSameFile(java.nio.file.Path,java.nio.file.Path)"
                          - code [ref=f23e1842]: same
                        - text: file, in which case the method completes without copying the file. File attributes are not required to be copied to the target file. If symbolic links are supported, and the file is a symbolic link, then the final target of the link is copied. If the file is a directory then it creates an empty directory in the target location (entries in the directory are not copied). This method can be used with the
                        - link [ref=f23e1843] [cursor=pointer]:
                          - /url: "#walkFileTree(java.nio.file.Path,java.util.Set,int,java.nio.file.FileVisitor)"
                          - code [ref=f23e1844]: walkFileTree
                        - text: method to copy a directory and all entries in the directory, or an entire file-tree where required.
                      - paragraph [ref=f23e1845]:
                        - text: The
                        - code [ref=f23e1846]: options
                        - text: "parameter may include any of the following:"
                      - table "Options" [ref=f23e1847]:
