                        - text: file, in which case this method has no effect. If the file is a symbolic link then the symbolic link itself, not the target of the link, is moved. This method may be invoked to move an empty directory. In some implementations a directory has entries for special files or links that are created when the directory is created. In such implementations a directory is considered empty when only the special entries exist. When invoked to move a directory that is not empty then the directory is moved if it does not require moving the entries in the directory. For example, renaming a directory on the same
                        - link [ref=f23e1929] [cursor=pointer]:
                          - /url: FileStore.html
                          - code [ref=f23e1930]: FileStore
                        - text: will usually not require moving the entries in the directory. When moving a directory requires that its entries be moved then this method fails (by throwing an
                        - code [ref=f23e1931]: IOException
                        - text: ). To move a file tree may involve copying rather than moving directories and this can be done using the
                        - link [ref=f23e1932] [cursor=pointer]:
                          - /url: "#copy(java.nio.file.Path,java.nio.file.Path,java.nio.file.CopyOption...)"
