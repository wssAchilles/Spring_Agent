                        - text: is thrown, then it is possible that the target file is incomplete or some of its file attributes have not been copied from the source file. When the
                        - code [ref=f23e1875]: REPLACE_EXISTING
                        - text: option is specified and the target file exists, then the target file is replaced. The check for the existence of the file and the creation of the new file may not be atomic with respect to other file system activities.
                      - paragraph [ref=f23e1876]: "Usage Example: Suppose we want to copy a file into a directory, giving it the same file name as the source file:"
