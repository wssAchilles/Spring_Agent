                    - generic [ref=f23e965]:
                      - text: Opens or creates a file, returning a seekable byte channel to access the file.
                      - paragraph [ref=f23e966]:
                        - text: The
                        - code [ref=f23e967]: options
                        - text: parameter determines how the file is opened. The
                        - link [ref=f23e968] [cursor=pointer]:
                          - /url: StandardOpenOption.html#READ
                          - code [ref=f23e969]: READ
                        - text: and
                        - link [ref=f23e970] [cursor=pointer]:
                          - /url: StandardOpenOption.html#WRITE
                          - code [ref=f23e971]: WRITE
                        - text: options determine if the file should be opened for reading and/or writing. If neither option (or the
                        - link [ref=f23e972] [cursor=pointer]:
                          - /url: StandardOpenOption.html#APPEND
                          - code [ref=f23e973]: APPEND
                        - text: option) is present then the file is opened for reading. By default reading or writing commence at the beginning of the file.
                      - paragraph [ref=f23e974]:
                        - text: In the addition to
                        - code [ref=f23e975]: READ
                        - text: and
                        - code [ref=f23e976]: WRITE
                        - text: ", the following options may be present:"
                      - table "Options" [ref=f23e977]:
                        - rowgroup [ref=f23e978]:
                          - row [ref=f23e979]:
                            - columnheader "Option" [ref=f23e980]
                            - columnheader "Description" [ref=f23e981]
                        - rowgroup [ref=f23e982]:
                          - row [ref=f23e983]:
                            - rowheader [ref=f23e984]:
                              - link [ref=f23e985] [cursor=pointer]:
                                - /url: StandardOpenOption.html#APPEND
                                - code [ref=f23e986]: APPEND
                            - cell [ref=f23e987]:
                              - text: If this option is present then the file is opened for writing and each invocation of the channel's
                              - code [ref=f23e988]: write
                              - text: method first advances the position to the end of the file and then writes the requested data. Whether the advancement of the position and the writing of the data are done in a single atomic operation is system-dependent and therefore unspecified. This option may not be used in conjunction with the
                              - code [ref=f23e989]: READ
                              - text: or
                              - code [ref=f23e990]: TRUNCATE_EXISTING
                              - text: options.
                          - row [ref=f23e991]:
                            - rowheader [ref=f23e992]:
                              - link [ref=f23e993] [cursor=pointer]:
                                - /url: StandardOpenOption.html#TRUNCATE_EXISTING
                                - code [ref=f23e994]: TRUNCATE_EXISTING
                            - cell "If this option is present then the existing file is truncated to a size of 0 bytes. This option is ignored when the file is opened only for reading." [ref=f23e995]
                          - row [ref=f23e996]:
                            - rowheader [ref=f23e997]:
                              - link [ref=f23e998] [cursor=pointer]:
                                - /url: StandardOpenOption.html#CREATE_NEW
                                - code [ref=f23e999]: CREATE_NEW
                            - cell "If this option is present then a new file is created, failing if the file already exists or is a symbolic link. When creating a file the check for the existence of the file and the creation of the file if it does not exist is atomic with respect to other file system operations. This option is ignored when the file is opened only for reading." [ref=f23e1000]
                          - row [ref=f23e1001]:
                            - rowheader [ref=f23e1002]:
                              - link [ref=f23e1003] [cursor=pointer]:
                                - /url: StandardOpenOption.html#CREATE
                                - code [ref=f23e1004]: CREATE
                            - cell [ref=f23e1005]:
                              - text: If this option is present then an existing file is opened if it exists, otherwise a new file is created. This option is ignored if the
                              - code [ref=f23e1006]: CREATE_NEW
                              - text: option is also present or the file is opened only for reading.
                          - row [ref=f23e1007]:
                            - rowheader [ref=f23e1008]:
                              - link [ref=f23e1009] [cursor=pointer]:
                                - /url: StandardOpenOption.html#DELETE_ON_CLOSE
                                - code [ref=f23e1010]: DELETE_ON_CLOSE
                            - cell [ref=f23e1011]:
                              - text: When this option is present then the implementation makes a
                              - emphasis [ref=f23e1012]: best effort
                              - text: attempt to delete the file when closed by the
                              - link [ref=f23e1013] [cursor=pointer]:
                                - /url: ../channels/Channel.html#close()
                                - code [ref=f23e1014]: close
                              - text: method. If the
                              - code [ref=f23e1015]: close
                              - text: method is not invoked then a
                              - emphasis [ref=f23e1016]: best effort
                              - text: attempt is made to delete the file when the Java virtual machine terminates.
                          - row [ref=f23e1017]:
                            - rowheader [ref=f23e1018]:
                              - link [ref=f23e1019] [cursor=pointer]:
                                - /url: StandardOpenOption.html#SPARSE
                                - code [ref=f23e1020]: SPARSE
                            - cell [ref=f23e1021]:
                              - text: When creating a new file this option is a
                              - emphasis [ref=f23e1022]: hint
                              - text: that the new file will be sparse. This option is ignored when not creating a new file.
                          - row [ref=f23e1023]:
                            - rowheader [ref=f23e1024]:
                              - link [ref=f23e1025] [cursor=pointer]:
                                - /url: StandardOpenOption.html#SYNC
                                - code [ref=f23e1026]: SYNC
                            - cell [ref=f23e1027]:
                              - text: Requires that every update to the file's content or metadata be written synchronously to the underlying storage device. (see
                              - link "Synchronized I/O file integrity" [ref=f23e1028] [cursor=pointer]:
                                - /url: package-summary.html#integrity
                              - text: ).
                          - row [ref=f23e1029]:
                            - rowheader [ref=f23e1030]:
                              - link [ref=f23e1031] [cursor=pointer]:
                                - /url: StandardOpenOption.html#DSYNC
                                - code [ref=f23e1032]: DSYNC
                            - cell [ref=f23e1033]:
                              - text: Requires that every update to the file's content be written synchronously to the underlying storage device. (see
                              - link "Synchronized I/O file integrity" [ref=f23e1034] [cursor=pointer]:
                                - /url: package-summary.html#integrity
                              - text: ).
