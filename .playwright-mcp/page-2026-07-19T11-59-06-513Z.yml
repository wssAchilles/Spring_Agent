                                - code [ref=f23e1856]: REPLACE_EXISTING
                            - cell "If the target file exists, then the target file is replaced if it is not a non-empty directory. If the target file exists and is a symbolic link, then the symbolic link itself, not the target of the link, is replaced." [ref=f23e1857]
                          - row [ref=f23e1858]:
                            - rowheader [ref=f23e1859]:
                              - link [ref=f23e1860] [cursor=pointer]:
                                - /url: StandardCopyOption.html#COPY_ATTRIBUTES
                                - code [ref=f23e1861]: COPY_ATTRIBUTES
                            - cell [ref=f23e1862]:
                              - text: Attempts to copy the file attributes associated with this file to the target file. The exact file attributes that are copied is platform and file system dependent and therefore unspecified. Minimally, the
                              - link [ref=f23e1863] [cursor=pointer]:
                                - /url: attribute/BasicFileAttributes.html#lastModifiedTime()
                                - code [ref=f23e1864]: last-modified-time
                              - text: is copied to the target file if supported by both the source and target file stores. Copying of file timestamps may result in precision loss.
                          - row [ref=f23e1865]:
                            - rowheader [ref=f23e1866]:
                              - link [ref=f23e1867] [cursor=pointer]:
                                - /url: LinkOption.html#NOFOLLOW_LINKS
                                - code [ref=f23e1868]: NOFOLLOW_LINKS
                            - cell [ref=f23e1869]:
                              - text: Symbolic links are not followed. If the file is a symbolic link, then the symbolic link itself, not the target of the link, is copied. It is implementation specific if file attributes can be copied to the new link. In other words, the
                              - code [ref=f23e1870]: COPY_ATTRIBUTES
                              - text: option may be ignored when copying a symbolic link.
                      - paragraph
                      - paragraph [ref=f23e1871]: An implementation of this interface may support additional implementation specific options.
                      - paragraph [ref=f23e1872]:
                        - text: Copying a file is not an atomic operation. If an
                        - link [ref=f23e1873] [cursor=pointer]:
