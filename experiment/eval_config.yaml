# ==============================================================================
# Hermes 自主智能体顶刊级自动化科研实验全局配置文件
# (Hermes Autonomous Agent Evaluation Configuration Specification)
# 严格遵循 AGENTS.md 规程设计，严禁随意放宽评测门禁与作弊阈值
# ==============================================================================

environment:
  # Java 21 隔离运行环境路径（SDKMAN 管理，严禁污染宿主环境）
  java_home: "/Users/achilles/.sdkman/candidates/java/21.0.5-tem"
  java_bin: "/Users/achilles/.sdkman/candidates/java/21.0.5-tem/bin/java"
  classpath_cache_file: "backend/qknow-hermes/qknow-hermes-core/target/test-cp.txt"
  probe_runner_class: "tech.qiantong.qknow.hermes.benchmark.HermesBenchmarkProbeRunner"
  # Hermes gRPC 核心网关配置
  grpc_host: "127.0.0.1"
  grpc_port: 50051
  # 沙箱幂等隔离机制：会话回滚与状态隔离
  sandbox_mode: "physical_probe"
  # 单任务执行最大硬超时时间（秒）
  timeout_seconds: 60
  # ReAct 单轮最大步数硬门禁（防止非受控死循环）
  max_react_steps: 10

models:
  # 官方活跃主干生成模型（严格遵循 DeepSeek 官方规约）
  generation_model: "deepseek-flash"
  # 思考模式（通过 extra_body 开启，严禁传 temperature）
  enable_thinking: true
  # 阿里千问 1536 维超球面单位向量模型
  embedding_model: "qwen-embedding-1536d"
  vector_dimension: 1536
  hyperspherical_geometry_constraint: "unit_sphere_l2_norm_1.0"

# 统计学多元随机种子空间（学术界顶刊 5+ 种子硬性规范）
seeds:
  - 42
  - 1024
  - 2024
  - 3407
  - 777

# 正交单变量消融实验矩阵（7 大核心生产资产消融组）
ablation_matrix:
  V1_full_hermes:
    code: "full_hermes"
    description: "完整生产方案: 六大资产全量激活 (Colbert SIMD + 自适应 RRF + 推测性 RAG + GraphRAG 社区树 + MCTS/DyLAN + 企业沙箱)"
    colbert_simd_enabled: true
    speculative_rag_enabled: true
    graphrag_tree_enabled: true
    hybrid_rrf_enabled: true
    mcts_dynamic_roles_enabled: true
    sandbox_reflexion_enabled: true

  V2_wo_colbert_simd:
    code: "wo_colbert_simd"
    description: "消融 ColBERT 晚期交互: 关闭 ColbertNative Panama SIMD 精排，退化为单一稠密向量点积"
    colbert_simd_enabled: false
    speculative_rag_enabled: true
    graphrag_tree_enabled: true
    hybrid_rrf_enabled: true
    mcts_dynamic_roles_enabled: true
    sandbox_reflexion_enabled: true

  V3_wo_speculative_rag:
    code: "wo_speculative_rag"
    description: "消融推测性 RAG 并行草稿: 关闭分片并行推演，退化为一次性长文档单步生成，验证中间迷失"
    colbert_simd_enabled: true
    speculative_rag_enabled: false
    graphrag_tree_enabled: true
    hybrid_rrf_enabled: true
    mcts_dynamic_roles_enabled: true
    sandbox_reflexion_enabled: true

  V4_wo_graphrag_tree:
    code: "wo_graphrag_tree"
    description: "消融 GraphRAG 分层社区树: 关闭 Leiden 分层社区索引，退化为扁平切块，验证全局概括覆盖度"
    colbert_simd_enabled: true
    speculative_rag_enabled: true
    graphrag_tree_enabled: false
    hybrid_rrf_enabled: true
    mcts_dynamic_roles_enabled: true
    sandbox_reflexion_enabled: true

  V5_wo_mcts_dynamic_roles:
    code: "wo_mcts_dynamic_roles"
    description: "消融 MCTS 树规划与夏普利涌现: 关闭树搜索前瞻与角色剪枝，退化为单 Agent 贪心 ReAct"
    colbert_simd_enabled: true
    speculative_rag_enabled: true
    graphrag_tree_enabled: true
    hybrid_rrf_enabled: false
    mcts_dynamic_roles_enabled: false
    sandbox_reflexion_enabled: true

  V6_wo_sandbox_reflexion:
    code: "wo_sandbox_reflexion"
    description: "消融企业沙箱与反思记忆: 关闭进程看门狗强杀与 Reflexion 先验提取，验证死循环与重复踩坑"
    colbert_simd_enabled: true
    speculative_rag_enabled: true
    graphrag_tree_enabled: true
    hybrid_rrf_enabled: true
    mcts_dynamic_roles_enabled: true
    sandbox_reflexion_enabled: false

  V7_baseline_vanilla_react:
    code: "baseline_vanilla_react"
    description: "原生基线组: 纯原生单步贪心 ReAct，无 SIMD / 无草稿分片 / 无社区树 / 无沙箱防御"
    colbert_simd_enabled: false
    speculative_rag_enabled: false
    graphrag_tree_enabled: false
    hybrid_rrf_enabled: false
    mcts_dynamic_roles_enabled: false
    sandbox_reflexion_enabled: false

# 统计学显著性验证推断参数
statistics:
  bootstrap_iterations: 10000
  confidence_level: 0.95
  significance_threshold_alpha: 0.05
  significance_threshold_alpha2: 0.01
  significance_threshold_alpha3: 0.001

# 成本预算与熔断守卫（严格控制在用户 8.00 元人民币额度以内）
cost_budget:
  hard_budget_cap_cny: 8.00
  soft_warning_threshold_cny: 6.50
  deepseek_official_pricing:
    # 官方价格：单位为元/百万 Tokens
    cache_hit_input_cny: 0.108
    cache_miss_input_cny: 1.080
    output_cny: 4.320
    usd_to_cny_exchange_rate: 7.20
