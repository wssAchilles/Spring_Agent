name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests (tests module + reactor deps)
        run: mvn -B -f backend/pom.xml -pl tests -am test
      - name: Upload surefire on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/tests/target/surefire-reports
          if-no-files-found: ignore
