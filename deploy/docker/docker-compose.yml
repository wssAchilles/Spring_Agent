# ============================================================================
# Phase 20: 生产级容器编排一键交付总入口 (Docker Compose v2 规范)
# 涵盖: PostgreSQL 16 + pgvector, Neo4j 5.26, Redis 7, Tantivy, Backend, Nginx
# ============================================================================
version: "3.8"

include:
  - path: ./docker-compose-base.yml
  - path: ./docker-compose-qknow.yml

networks:
  qknownet:
    name: agent-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    name: agent-postgres-data
  neo4j_data:
    name: agent-neo4j-data
  neo4j_logs:
    name: agent-neo4j-logs
  redis_data:
    name: agent-redis-data
  tantivy_data:
    name: agent-tantivy-data
