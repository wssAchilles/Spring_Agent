# ============================================================================
# Phase 20: 生产级 Nginx 前端反代与 SSE 流式传输配置
# 涵盖: SPA 单页路由 fallback、Gzip 静态加速、流式打字机彻底禁用缓冲
# ============================================================================
server {
    listen 80;
    server_name localhost;

    client_max_body_size 500M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 1. 前端静态单页应用 (Vue 3 / Vite 产物托管)
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
        charset utf-8;

        # 静态资源强缓存策略
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. 后端通用 API 与 SSE 流式打字机反向代理
    location /prod-api/ {
        # 彻底关闭缓冲，保障 SSE (Server-Sent Events) 打字机实时推送
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型长耗时流式请求超时保持 (10 分钟)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 路径重写与后端路由转发
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_pass http://backend:8099;
    }

    # 3. 监控就绪探针透明转发
    location /actuator/ {
        proxy_pass http://backend:8099/actuator/;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }
}
