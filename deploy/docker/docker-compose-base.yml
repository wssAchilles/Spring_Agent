# ============================================================================
# Phase 20: 生产级基础设施容器编排 (Docker Compose v2 规范)
# 涵盖: PostgreSQL 16 + pgvector, Neo4j 5.26, Redis 7, Tantivy-Server, Nginx 1.26
# 彻底淘汰过时的 MySQL 5.7 与 Weaviate
# ============================================================================
version: "3.8"

services:
  # --------------------------------------------------------------------------
  # 1. 关系数据库与 1536 维向量存储 (PostgreSQL 16 + pgvector 官方镜像)
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_connections=200
      -c max_parallel_maintenance_workers=4
    ports:
      - "${EXPOSE_PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qknownet

  # --------------------------------------------------------------------------
  # 2. 内存缓存与分布式锁 (Redis 7 - AOF 持久化与强密码保护)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: always
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redispass123}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispass123}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${EXPOSE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - qknownet

  # --------------------------------------------------------------------------
  # 3. 知识图谱数据库 (Neo4j 5.26.0 - APOC 扩展与严格内存池上限)
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0
    container_name: agent-neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4jpass123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    ports:
      - "${EXPOSE_NEO4J_HTTP:-7474}:7474"
      - "${EXPOSE_NEO4J_BOLT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neo4jpass123}", "RETURN 1;"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - qknownet

  # --------------------------------------------------------------------------
  # 4. 中文倒排检索引擎 (Rust Tantivy-Server - Axum REST + Jieba 中文分词)
  # --------------------------------------------------------------------------
  tantivy:
    image: agent-tantivy:latest
    container_name: agent-tantivy
    restart: always
    environment:
      PORT: "50051"
      TANTIVY_INDEX_DIR: "/app/data/tantivy_index"
      RUST_LOG: "info"
    ports:
      - "${EXPOSE_TANTIVY_PORT:-50051}:50051"
    volumes:
      - tantivy_data:/app/data/tantivy_index
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:50051/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - qknownet

  # --------------------------------------------------------------------------
  # 5. 前端静态反向代理网关 (Nginx 1.26 - 单页 Fallback、Gzip 加速与 SSE 无缓冲)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.26-alpine
    container_name: agent-nginx
    restart: always
    ports:
      - "${EXPOSE_HTTP_PORT:-80}:80"
    volumes:
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - qknownet
