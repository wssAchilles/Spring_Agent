# ============================================================================
# Phase 20: 业务核心应用编排 (Spring Boot 3 / Java 21 运行时)
# 涵盖: cgroups 容器内存感知、service_healthy 级联健康探针、四大异构数据底座接入
# ============================================================================
version: "3.8"
services:
  backend:
    image: ${QKNOW_HUB:-agent}/qknow-server-ce:${QKNOW_TAG:-latest}
    container_name: agent-backend
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
      SPRING_PROFILES_ACTIVE: prod
      # 数据源配置映射 (PostgreSQL 16 + pgvector)
      DATASOURCE_TYPE: postgresql
      POSTGRESQL_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass123}
      # Neo4j 图数据库配置
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpass123}
      # Tantivy 中文倒排检索引擎地址
      TANTIVY_SERVER_URL: http://tantivy:50051
      # 模型生态基线参数 (唯一生成模型: DeepSeek API, 唯一向量模型: 阿里千问)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET environment variable must be configured for production deployment}
      HERMES_GRPC_HOST: hermes
      HERMES_GRPC_PORT: 9090
      HERMES_GRPC_AUTH_TOKEN: ${HERMES_GRPC_AUTH_TOKEN:?HERMES_GRPC_AUTH_TOKEN environment variable must be configured for production deployment}
      # P0-04: 生产建议开启 TLS（证书挂载到 ./certs）
      HERMES_GRPC_TLS_ENABLED: ${HERMES_GRPC_TLS_ENABLED:-false}
      HERMES_GRPC_TLS_TRUST_CERT_PATH: ${HERMES_GRPC_TLS_TRUST_CERT_PATH:-/etc/qknow/certs/ca.crt}
      HERMES_GRPC_TLS_CLIENT_CERT_PATH: ${HERMES_GRPC_TLS_CLIENT_CERT_PATH:-/etc/qknow/certs/client.crt}
      HERMES_GRPC_TLS_CLIENT_KEY_PATH: ${HERMES_GRPC_TLS_CLIENT_KEY_PATH:-/etc/qknow/certs/client.key}
      REDIS_DATABASE: 3
      # 原生 MCP Server HTTP 端点（默认关闭；启用必须配置访问令牌）
      MCP_SERVER_ENABLED: ${MCP_SERVER_ENABLED:-false}
      MCP_SERVER_AUTH_TOKEN: ${MCP_SERVER_AUTH_TOKEN:-}
    ports:
      - "${EXPOSE_BACKEND_PORT:-8099}:8099"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qknow-server/logs:/usr/app/jar/logs
      - ./qknow-server/upload:/usr/app/jar/upload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      tantivy:
        condition: service_healthy
      hermes:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - qknownet

  hermes:
    image: ${QKNOW_HUB:-agent}/qknow-hermes:${QKNOW_TAG:-latest}
    container_name: agent-hermes
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
        -Djava.security.egd=file:/dev/./urandom
      # Hermes 自身读取的模型/DB/Redis 环境变量（键名必须与 application.yml 对齐）
      HERMES_OPENAI_API_KEY: ${DEEPSEEK_API_KEY}
      HERMES_OPENAI_BASE_URL: https://api.deepseek.com
      TONGYI_API_KEY: ${DASHSCOPE_API_KEY}
      POSTGRESQL_URL: ${POSTGRESQL_URL:-jdbc:postgresql://postgres:5432/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass123}
      REDIS_DATABASE: 3
      # 与控制面一致的敏感字段加密口令，用于本地解密 ai_api_key
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET environment variable must be configured for production deployment}
      HERMES_GRPC_AUTH_TOKEN: ${HERMES_GRPC_AUTH_TOKEN:?HERMES_GRPC_AUTH_TOKEN environment variable must be configured for production deployment}
      # P0-04: 生产开启 TLS/mTLS；证书放入 ./certs
      HERMES_GRPC_TLS_ENABLED: ${HERMES_GRPC_TLS_ENABLED:-false}
      HERMES_GRPC_TLS_CERT_CHAIN: ${HERMES_GRPC_TLS_CERT_CHAIN:-file:/etc/qknow/certs/server.crt}
      HERMES_GRPC_TLS_PRIVATE_KEY: ${HERMES_GRPC_TLS_PRIVATE_KEY:-file:/etc/qknow/certs/server.key}
      HERMES_GRPC_TLS_TRUST_STORE: ${HERMES_GRPC_TLS_TRUST_STORE:-file:/etc/qknow/certs/ca.crt}
      HERMES_GRPC_TLS_CLIENT_AUTH: ${HERMES_GRPC_TLS_CLIENT_AUTH:-NONE}
    # 彻底关闭宿主明文 9090/8081 裸露映射，仅允许在容器内网 qknownet 相互通信 (P0-04)
    expose:
      - "9090"
      - "8081"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./certs:/etc/qknow/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - qknownet
