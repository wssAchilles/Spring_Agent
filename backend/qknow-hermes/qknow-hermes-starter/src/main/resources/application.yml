server:
  port: 8081

grpc:
  server:
    port: 9090
    keep-alive-time: 60s
    max-inbound-message-size: 16777216  # 16MB
    # P0-04: 生产必须开启 TLS/mTLS，并挂载证书；开发环境默认关闭
    security:
      enabled: ${HERMES_GRPC_TLS_ENABLED:false}
      certificate-chain: ${HERMES_GRPC_TLS_CERT_CHAIN:}
      private-key: ${HERMES_GRPC_TLS_PRIVATE_KEY:}
      trust-store: ${HERMES_GRPC_TLS_TRUST_STORE:}
      client-auth: ${HERMES_GRPC_TLS_CLIENT_AUTH:NONE}

spring:
  application:
    name: qknow-hermes
  datasource:
    url: ${POSTGRESQL_URL:jdbc:postgresql://127.0.0.1:5432/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${POSTGRESQL_USERNAME:achilles}
    password: ${POSTGRESQL_PASSWORD:achilles}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 必须与控制面使用同一 Redis DB，否则跨 JVM 审批/记忆数据不可见 (P0-09)
      database: ${REDIS_DATABASE:3}
      timeout: 5s
  ai:
    openai:
      api-key: ${HERMES_OPENAI_API_KEY:sk-placeholder}
      base-url: ${HERMES_OPENAI_BASE_URL:https://api.deepseek.com}
    ollama:
      base-url: ${HERMES_OLLAMA_BASE_URL:http://localhost:11434}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        # [溯源] 算法优化指南 §5.1: HNSW 参数调优 P0
        # m=32 提升召回率 ~4%, ef_construction=128 提升索引质量
        index:
          m: 32
          ef-construction: 128
        ef-search: 100

# 与控制面共享的敏感字段加密口令：Hermes 本地解密 ai_api_key（不得随 gRPC 下发明文密钥）
token:
  secret: ${TOKEN_SECRET:qknow-jwt-secret-key-32bytes-secure-2026}
mybatis-plus:
  encryptor:
    password: ${MYBATIS_ENCRYPTOR_PASSWORD:${TOKEN_SECRET:qknow-jwt-secret-key-32bytes-secure-2026}}

hermes:
  orchestration:
    enabled: ${HERMES_ORCHESTRATION_ENABLED:false}
    timeout-ms: ${HERMES_ORCHESTRATION_TIMEOUT_MS:15000}
    max-workers: ${HERMES_ORCHESTRATION_MAX_WORKERS:3}
    debate-rounds: ${HERMES_ORCHESTRATION_DEBATE_ROUNDS:1}
    max-cost-cny: ${HERMES_ORCHESTRATION_MAX_COST_CNY:0.05}
    receipt-cache-max-entries: ${HERMES_ORCHESTRATION_RECEIPT_CACHE_MAX_ENTRIES:256}
    receipt-cache-ttl-ms: ${HERMES_ORCHESTRATION_RECEIPT_CACHE_TTL_MS:1800000}
  routing:
    tool-calling-model:
      enabled: false
      platform: deepseek
      base-url: ${HERMES_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${HERMES_OPENAI_API_KEY:}
      model-name: ${HERMES_DEFAULT_MODEL:deepseek-flash}
  judge:
    enabled: false  # 关闭反思循环，省 ~15% tokens
    min-score: 0.6
    max-reflection-rounds: 3
  reflection:
    enabled: false  # 关闭反思
    max-rounds: 3
  eval:
    enabled: false
  memory:
    short-term:
      max-messages: 50
    long-term:
      enabled: true
  rag:
    cache:
      enabled: true
      ttl: 300
    contextual:
      enabled: true
      platform: DeepSeek
      base-url: ${HERMES_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${HERMES_OPENAI_API_KEY:}
      model-name: ${HERMES_DEFAULT_MODEL:deepseek-flash}
      max-doc-chars: 8000
      max-concurrent: 3
    hype:
      enabled: true
      platform: DeepSeek
      base-url: ${HERMES_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${HERMES_OPENAI_API_KEY:}
      model-name: ${HERMES_DEFAULT_MODEL:deepseek-flash}
      question-count: 3
      max-chunk-chars: 2000
      timeout-seconds: 30
      max-chunks-per-document: 20
    colbert:
      enabled: true
      ngram-size: 3
      skip-when-no-embedding: true
  observability:
    langfuse:
      enabled: ${LANGFUSE_ENABLED:false}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}

qknow:
  hermes:
    plan-solve:
      enabled: false
      rp-react-enabled: true
      max-tasks: 5
      max-reflection-retries: 1
      max-concurrent-plan-tasks: 4
      max-concurrent-react-runs: 16
      max-token-budget: 0
      complex-keywords:
        - 对比
        - 比较
        - 分析
        - 总结
        - 综合
        - 分别
        - 最后
        - 写成
        - 财报
        - 邮件
  rag:
    simple:
      light-retrieval: true
      light-top-k: 5
    eval:
      threshold: 0.85
      prompt-version: manual-v1
      platform: DeepSeek
      model-name: ${HERMES_DEFAULT_MODEL:deepseek-flash}
      base-url: ${HERMES_OPENAI_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${HERMES_OPENAI_API_KEY:}

logging:
  level:
    tech.qiantong.qknow.hermes: DEBUG
    io.grpc: INFO
